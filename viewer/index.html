<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Take the body apart</title>
  <meta name="description" content="An open anatomy body you can take apart with a slider, and look at one part at a time.">
  <link rel="icon" href="data:,">
  <style>
    :root {
      --bg: #f3f1ec;
      --panel: #fffdf9;
      --ink: #23201c;
      --muted: #6f685f;
      --line: #dcd6cc;
      --accent: #2a5d9f;
      --accent-ink: #ffffff;
      --ghost: #ece8e0;
      --radius: 10px;
      --bar: 56px;
      font-size: 16px;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid;
      grid-template-rows: var(--bar) 1fr auto;
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.4;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }
    h1, h2 { font-weight: 600; margin: 0; }
    h1 { font-size: 1.05rem; white-space: nowrap; }
    h2 { font-size: 1.25rem; margin-bottom: .35rem; }
    p { margin: 0 0 .6rem; }
    .muted { color: var(--muted); }
    .small { font-size: .85rem; }
    button, input { font: inherit; color: inherit; }
    button { cursor: pointer; }
    :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

    .bar {
      display: flex; align-items: center; gap: .75rem;
      padding: 0 1rem; border-bottom: 1px solid var(--line); background: var(--panel);
    }
    .bar .spacer { flex: 1; }
    .button {
      min-height: 44px; padding: 0 1rem; border-radius: var(--radius);
      border: 1px solid var(--line); background: var(--panel); color: var(--ink);
      white-space: nowrap;
    }
    .button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
    .switch { display: inline-flex; align-items: center; gap: .45rem; min-height: 44px; cursor: pointer; user-select: none; }
    .switch input { width: 1.25rem; height: 1.25rem; accent-color: var(--accent); margin: 0; }
    #panel-toggle { display: none; }

    main { position: relative; display: grid; grid-template-columns: 1fr 340px; min-height: 0; overflow: hidden; }
    #stage { position: relative; min-width: 0; min-height: 0; touch-action: none; overflow: hidden; }
    #view { display: block; width: 100%; height: 100%; outline-offset: -3px; }
    #view.over-part { cursor: pointer; }
    #status {
      position: absolute; left: 50%; top: 1rem; transform: translateX(-50%);
      padding: .5rem 1rem; border-radius: var(--radius); background: var(--panel);
      border: 1px solid var(--line); width: max-content; max-width: min(90%, 36rem); z-index: 2;
    }
    #status.error { border-color: #b3261e; color: #8a1c15; }
    #picker {
      position: absolute; inset: 0; display: grid; place-content: center; gap: .75rem;
      padding: 4.5rem 1rem 1rem; text-align: center; background: color-mix(in srgb, var(--bg) 85%, transparent);
    }
    #picker input { max-width: 100%; }
    .hint {
      position: absolute; left: 1rem; bottom: 1rem; padding: .4rem .7rem; border-radius: var(--radius);
      background: color-mix(in srgb, var(--panel) 85%, transparent); color: var(--muted); font-size: .9rem;
      pointer-events: none; transition: opacity .4s;
    }
    .isolated .hint { opacity: 0; }
    #hover {
      position: absolute; left: 0; top: 0; padding: .2rem .55rem; border-radius: 6px;
      background: var(--ink); color: var(--panel); font-size: .9rem; white-space: nowrap;
      pointer-events: none; will-change: transform;
    }

    #panel {
      display: flex; flex-direction: column; min-height: 0;
      border-left: 1px solid var(--line); background: var(--panel);
    }
    .info { padding: 1rem; border-bottom: 1px solid var(--line); }
    .info .source { display: inline-block; padding: .15rem .6rem; border-radius: 999px; font-size: .85rem; background: var(--ghost); }
    .info .source.modelled { background: #e1ecf5; }
    .info dl { display: grid; grid-template-columns: auto 1fr; gap: .2rem .8rem; margin: .5rem 0 .75rem; font-size: .9rem; }
    .info dt { color: var(--muted); }
    .info dd { margin: 0; overflow-wrap: anywhere; }
    .info .actions { display: flex; align-items: center; justify-content: space-between; gap: .75rem; flex-wrap: wrap; }
    .search { padding: .75rem 1rem; border-bottom: 1px solid var(--line); }
    .search input {
      width: 100%; min-height: 44px; padding: 0 .9rem; border-radius: var(--radius);
      border: 1px solid var(--line); background: var(--bg);
    }
    .list { flex: 1; overflow-y: auto; padding: 0 0 1rem; overscroll-behavior: contain; }
    .group-header {
      position: sticky; top: 0; z-index: 1; display: flex; align-items: center; gap: .6rem;
      min-height: 44px; padding: 0 1rem; background: var(--panel); border-bottom: 1px solid var(--line);
      cursor: pointer;
    }
    .group-header input { width: 1.2rem; height: 1.2rem; accent-color: var(--accent); margin: 0; }
    .group-title { flex: 1; font-weight: 600; }
    .list ul { list-style: none; margin: 0; padding: 0; }
    .item {
      display: flex; align-items: center; gap: .5rem; width: 100%; min-height: 44px;
      padding: .3rem 1rem .3rem 2.6rem; border: 0; background: none; text-align: left;
      scroll-margin-top: 48px;
    }
    .item:hover { background: var(--ghost); }
    .item[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
    .item-name { flex: 1; }
    .item .term, .item .tag { font-size: .8rem; color: var(--muted); }
    .item[aria-pressed="true"] .term, .item[aria-pressed="true"] .tag { color: var(--accent-ink); opacity: .85; }
    .item .tag { padding: 0 .4rem; border-radius: 999px; background: var(--ghost); }
    .item[aria-pressed="true"] .tag { background: none; }
    .group.off .item-name { color: var(--muted); }

    .slider-bar {
      display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 0 1rem;
      min-height: 64px; padding: 0 1rem env(safe-area-inset-bottom, 0px);
      border-top: 1px solid var(--line); background: var(--panel);
    }
    .slider-bar label { font-weight: 600; }
    #take-apart { width: 100%; height: 44px; margin: 0; accent-color: var(--accent); }
    #take-apart-value { min-width: 6.5rem; text-align: right; font-variant-numeric: tabular-nums; }

    @media (max-width: 760px) {
      :root { --bar: 52px; }
      h1 { font-size: 1rem; }
      #count { display: none; }
      #panel-toggle { display: inline-block; }
      main { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
      /* The list is a sheet behind the "Parts" button. */
      #panel {
        position: absolute; left: 0; right: 0; bottom: 0; max-height: 75%;
        border-left: 0; border-top: 1px solid var(--line); border-radius: 16px 16px 0 0;
        box-shadow: 0 -8px 24px rgba(0, 0, 0, .08);
        transform: translateY(100%); visibility: hidden;
        transition: transform .25s ease, visibility 0s linear .25s;
      }
      .panel-open #panel { transform: none; visibility: visible; transition: transform .25s ease; }
      /* One part on its own: its card sits under the 3D view, which shrinks to make room. */
      .isolated:not(.panel-open) #panel {
        position: static; transform: none; visibility: visible; transition: none;
        max-height: 40vh; overflow-y: auto; border-radius: 0; box-shadow: none;
      }
      .isolated:not(.panel-open) #panel .search,
      .isolated:not(.panel-open) #panel .list { display: none; }
      .isolated:not(.panel-open) #panel .info { border-bottom: 0; }
      .info { padding: .8rem 1rem; }
      .hint { right: 1rem; font-size: .85rem; }
      /* The name and the value above, the slider across the whole width below. */
      .slider-bar { grid-template-columns: 1fr auto; padding-top: .45rem; }
      .slider-bar label { grid-area: 1 / 1; }
      #take-apart-value { grid-area: 1 / 2; min-width: 0; font-size: .9rem; }
      #take-apart { grid-area: 2 / 1 / 3 / 3; }
    }
    @media (prefers-reduced-motion: reduce) {
      #panel, .hint { transition: none !important; }
    }
  </style>
  <!-- three.js is pinned to one release; the hashes make the browser refuse any
       other bytes. To change the version, see "Changing three.js" in README.md. -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/"
      },
      "integrity": {
        "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js": "sha384-T/E3B9AvPtLn5PKD7aTSFqizQcA4kHDfU0lub7u0fvM4w9BMGcSb3yI7r5LqMAMn",
        "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.core.js": "sha384-drH6BueSlcvoXCwAqWkNJvXwu2Ax3mnGOmZnIXaomedIw+uXSP9Bf/XIUINgLUW+",
        "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/loaders/GLTFLoader.js": "sha384-WH6tljjFikpYMGa2JMqlbJlM1lEMkd/Y6Sqnuog1rX87eShphltUQI5NKByEo4CP",
        "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/controls/OrbitControls.js": "sha384-ZVBN/wmVxgX0mUGjFJXakzzdZrAF4g4aHfKyusbjoF0WsVXSoGpeM/qRaVnXtaFo",
        "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/utils/BufferGeometryUtils.js": "sha384-NArny884Zj3HwjLRjeY1kbfLZnAHIElzho3N71FW0eMGxxBT+QuLEiSnSgpSaBXh",
        "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/utils/SkeletonUtils.js": "sha384-Pozn8j5+YFr3ak8Pm90ayqDrGYn/DV7vVs/YIIqzJhzeJT0LQksoS1fZQ5lfsYlw"
      }
    }
  </script>
</head>
<body>
  <header class="bar">
    <h1>Open anatomy</h1>
    <span id="count" class="muted small"></span>
    <span class="spacer"></span>
    <label class="switch" title="Show anatomical names and IDs">
      <input type="checkbox" id="clinician">
      <span>Clinician</span>
    </label>
    <button id="panel-toggle" class="button" type="button" aria-expanded="false" aria-controls="panel">Parts</button>
  </header>
  <main>
    <div id="stage">
      <canvas id="view" tabindex="0" aria-label="The body in 3D. Arrow keys turn it, plus and minus zoom."></canvas>
      <div id="hover" hidden></div>
      <div id="status" role="status" aria-live="polite">Loading…</div>
      <div id="picker" hidden>
        <p>Choose a body to show: its <strong>.glb</strong> file and its <strong>.manifest.json</strong>.</p>
        <input id="files" type="file" multiple accept=".glb,.json,model/gltf-binary,application/json">
      </div>
      <div id="hint" class="hint" hidden>Drag to turn, scroll or pinch to zoom, tap a part to see it alone.</div>
    </div>
    <aside id="panel" aria-label="Parts">
      <section id="info" class="info" aria-live="polite"></section>
      <div class="search">
        <input id="search" type="search" placeholder="Find a part" aria-label="Find a part" autocomplete="off">
      </div>
      <div id="structures" class="list" aria-label="All parts, by system"></div>
    </aside>
  </main>
  <footer class="slider-bar">
    <label for="take-apart">Take apart</label>
    <input id="take-apart" type="range" min="0" max="1" step="0.01" value="0" aria-valuetext="together">
    <span id="take-apart-value" class="muted">together</span>
  </footer>
  <noscript><p style="position: fixed; inset: 40% 1rem auto; text-align: center">This page needs JavaScript to show the body.</p></noscript>
  <script>
    // If the page's code or the 3D library cannot be fetched (no network, a
    // blocked CDN), say so instead of staying on "Loading…".
    function viewerScriptFailed() {
      var status = document.getElementById("status");
      status.textContent = "Could not load the 3D library. Check the internet connection and reload.";
      status.className = "error";
      document.documentElement.dataset.error = "the page's modules did not load";
    }
  </script>
  <script type="module" src="./main.js" onerror="viewerScriptFailed()"></script>
</body>
</html>
