[project]
name = "open-anatomy"
version = "0.0.0"
description = "Open, imaging-based human anatomy models built from scripts"
license = "Apache-2.0"
requires-python = ">=3.11"

[project.optional-dependencies]
# mesh.py and mesh_check.py
mesh = ["nibabel==5.4.2", "numpy==2.5.4", "scipy==1.18.1", "vtk==9.7.2"]
# fetch.py, segment.py and mesh.py
pipeline = ["open-anatomy[mesh]", "TotalSegmentator==2.18.0"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Modules in scripts/ count as first-party imports in tests.
src = [".", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.setuptools]
py-modules = []
