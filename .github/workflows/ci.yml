name: CI

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint and self-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: pipx run ruff==0.17.4 check scripts blender
      - run: pipx run ruff==0.17.4 format --check scripts blender
      - run: shellcheck scripts/*.sh
      - run: python3 scripts/bake_check.py
      # No Blender on the runner, so this reports a skip. Run it locally with Blender.
      - run: scripts/self-check.sh
      - run: pipx run uv venv .venv -p 3.12
      - run: pipx run uv pip install --python .venv/bin/python -e '.[mesh]'
      - run: .venv/bin/python scripts/mesh_check.py
